name: Test deployment

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-deploy:
    name: Validate and build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund --loglevel verbose 2>&1 | tee npm-ci.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            diagnostic="$(tail -n 40 npm-ci.log)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=npm ci failed::$diagnostic"
            exit "$status"
          fi

      - name: Validate OKF bundle
        run: npm run validate

      - name: Build Docusaurus
        run: npm run build
